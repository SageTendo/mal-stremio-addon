name: Preview

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - dev

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  MONGO_URI: ${{ secrets.MONGO_URI }}
  MAL_ID: ${{ secrets.MAL_ID }}
  MAL_SECRET: ${{ secrets.MAL_SECRET }}
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff formatter
        run: ruff format --check .

  test:
    environment: Preview
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # - name: Restore uv cache
      #   uses: actions/cache@v5
      #   with:
      #     path: /tmp/.uv-cache
      #     key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      #     restore-keys: |
      #       uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      #       uv-${{ runner.os }}

      - name: Install Dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run pytest
        run: |
          export MONGO_URI="${{ env.MONGO_URI }}"
          export SECRET_KEY="${{ env.SECRET_KEY }}"
          export MAL_ID="${{ env.MAL_ID }}"
          export MAL_SECRET="${{ env.MAL_SECRET }}"
          export MONGO_DB="${{ vars.MONGO_DB }}"
          export MONGO_UID_MAP_COLLECTION="${{ vars.MONGO_UID_MAP_COLLECTION }}"
          uv run pytest

      # - name: Minimize uv cache
      #   run: uv cache prune --ci
